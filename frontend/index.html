<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply theme before the app loads to avoid a flash of the wrong theme.
      // Claro's brand design is light-first (Material 3), so we only switch
      // to dark when the user explicitly chose it or their OS prefers it.
      try {
        const t = localStorage.getItem('theme')
        if (t === 'dark') {
          document.documentElement.classList.add('dark')
        } else if (t === 'light') {
          document.documentElement.classList.remove('dark')
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Claro | AI Email Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
